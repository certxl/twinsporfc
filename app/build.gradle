plugins {
    id 'com.android.application'
}

// İmzalı (release) APK için: proje köküne keystore.properties koy (README'de anlatılıyor)
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ks.load(it) } }

android {
    namespace 'com.twinspor.fc'
    compileSdk 35

    defaultConfig {
        applicationId "com.twinspor.fc"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // BOŞ  = site uygulamanın içine gömülü çalışır (assets/www)
        // DOLU = uygulama bu canlı adresi açar, örn: "https://siten.com/index.html" (site güncellenince uygulama da güncellenir)
        buildConfigField "String", "START_URL", "\"\""
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
